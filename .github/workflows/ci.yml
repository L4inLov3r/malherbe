name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integrite:
    name: Intégrité du dépôt (vérifications déterministes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôles d'intégrité (IDs, décompte, octets, frontmatter, régressions)
        run: python3 scripts/verifie.py
      - name: Compteurs déterministes sur les fixtures
        run: python3 scripts/audit.py tests/fixtures.md
